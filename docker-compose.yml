services:
    wartable:
        platform: linux/amd64
        # Tracks the newest non-breaking release in the major. Set WARTABLE_TAG
        # to a full version (2.1.0) to pin, or to a new major when you choose to
        # make that jump: a major is never picked up automatically.
        image: ghcr.io/alex98235/wartable:${WARTABLE_TAG:-2}
        container_name: wartable
        restart: unless-stopped
        ports:
            - '5110:5110'
        # Replacing an older install that kept its database in ./data starts
        # empty: copy that directory into the volume first, as described in
        # docs/updates.md.
        volumes:
            - wartable-data:/data
        command:
            - --mode
            - serve
            - --host
            - 0.0.0.0
            - --port
            - '5110'
            - --db
            - /data/wartable.db
        environment:
            Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
            # Optional semantic search. Override these in `.env` or leave the
            # defaults; inside the container 127.0.0.1/localhost is the
            # container, so the host Ollama endpoint is used by default.
            Embeddings__Enabled: "${Embeddings__Enabled:-false}"
            Embeddings__Endpoint: "${Embeddings__Endpoint:-http://host.docker.internal:11434/v1}"
            Embeddings__Model: "${Embeddings__Model:-embeddinggemma}"
            Embeddings__Dimensions: "${Embeddings__Dimensions:-768}"
            Embeddings__MaxInputTokens: "${Embeddings__MaxInputTokens:-512}"
            Embeddings__ApiKey: "${Embeddings__ApiKey:-}"
            Embeddings__Profile: "${Embeddings__Profile:-}"
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        healthcheck:
            test:
                [
                    'CMD',
                    '/usr/local/bin/busybox',
                    'wget',
                    '-q',
                    '-O',
                    '/dev/null',
                    'http://127.0.0.1:5110/api/health',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

volumes:
    wartable-data:
        name: wartable-data
