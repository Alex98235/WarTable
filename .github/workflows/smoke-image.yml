name: Image smoke test

# Exercises an already-published container image: pull, start with a fresh
# volume, check health, REST, MCP, restart, and persistence. It never builds or
# pushes. The GHCR package is public, so the pull normally works anonymously.
# The login is kept for a private fork/private package and to avoid anonymous
# pull rate limits.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Full image reference to pull and smoke test
        required: true
        type: string
        default: "ghcr.io/alex98235/wartable:0.1.0"

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: Smoke test published image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Log in to GHCR
        # The package is public, so this is only needed for a private fork or
        # private package, and it avoids anonymous pull rate limits.
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        env:
          IMAGE: ${{ github.event.inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE"

      - name: Smoke test
        shell: bash
        env:
          IMAGE: ${{ github.event.inputs.image }}
        run: |
          set -euo pipefail

          CONTAINER="wartable-smoke-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-$$"
          VOLUME="wartable-smoke-data-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-$$"
          HOST_PORT=5110
          BASE_URL="http://127.0.0.1:${HOST_PORT}"
          CAMPAIGN_TITLE="CI smoke ${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"

          # Always remove the container and its named volume. On failure, also
          # dump the container logs so the run is diagnosable.
          cleanup() {
            local status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::docker logs ${CONTAINER}"
              docker logs "$CONTAINER" 2>&1 || true
              echo "::endgroup::"
            fi
            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker volume rm "$VOLUME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_for_health() {
            local attempt body
            for attempt in $(seq 1 60); do
              body="$(curl -fsS "${BASE_URL}/api/health" 2>/dev/null || true)"
              if [ -n "$body" ] && printf '%s' "$body" | jq -e '.status == "ok"' >/dev/null 2>&1; then
                echo "health ok after ${attempt}s"
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for ${BASE_URL}/api/health" >&2
            return 1
          }

          # The MCP endpoint answers JSON-RPC over SSE. Extract the data line
          # and hand the JSON body to the caller.
          mcp_call() {
            local payload="$1" response
            response="$(curl -fsS -X POST "${BASE_URL}/mcp" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d "$payload")"
            printf '%s\n' "$response" | sed -n 's/^data: //p' | tail -n 1
          }

          docker run -d \
            --name "$CONTAINER" \
            -p "${HOST_PORT}:5110" \
            -v "${VOLUME}:/data" \
            "$IMAGE"

          wait_for_health

          campaign_json="$(curl -fsS -X POST "${BASE_URL}/api/campaigns" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg title "$CAMPAIGN_TITLE" \
              '{title: $title, charter: "Created by the image smoke test", tags: "smoke"}')")"
          campaign_id="$(printf '%s' "$campaign_json" | jq -r '.id // empty')"
          if [ -z "$campaign_id" ]; then
            echo "Campaign creation returned no id: ${campaign_json}" >&2
            exit 1
          fi
          echo "created campaign ${campaign_id}"

          init_json="$(mcp_call '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"wartable-image-smoke","version":"1.0.0"}}}')"
          server_name="$(printf '%s' "$init_json" | jq -r '.result.serverInfo.name // empty')"
          if [ "$server_name" != "wartable-mcp" ]; then
            echo "Unexpected MCP serverInfo.name: '${server_name}'" >&2
            exit 1
          fi

          tools_json="$(mcp_call '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          tool_count="$(printf '%s' "$tools_json" | jq '.result.tools | length')"
          if [ "$tool_count" -ne 32 ]; then
            echo "Expected 32 MCP tools, got ${tool_count}" >&2
            exit 1
          fi
          echo "MCP server ${server_name} exposes ${tool_count} tools"

          # Restart the same container, same named volume. The campaign must
          # still be readable and the database file must still exist on disk.
          docker restart "$CONTAINER" >/dev/null
          wait_for_health

          persisted_title="$(curl -fsS "${BASE_URL}/api/campaigns/${campaign_id}" | jq -r '.title // empty')"
          if [ "$persisted_title" != "$CAMPAIGN_TITLE" ]; then
            echo "Campaign did not persist across restart: '${persisted_title}'" >&2
            exit 1
          fi

          if ! docker exec "$CONTAINER" test -f /data/wartable.db; then
            echo "Database file /data/wartable.db is missing after restart" >&2
            exit 1
          fi

          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' 2>/dev/null || true)"
          digest="${digest##*@}"
          digest="${digest:-$(docker image inspect "$IMAGE" --format '{{.Id}}')}"

          echo "IMAGE SMOKE OK image=${IMAGE} digest=${digest} campaign=${campaign_id} tools=${tool_count}"
