name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            WarTable.Client/package-lock.json

      - name: Install root tooling
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix WarTable.Client

      # The frontend build writes into WarTable.Api/wwwroot, which the backend
      # project embeds. It must run before the backend compiles.
      - name: Build frontend
        run: npm run build:frontend

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build backend
        run: dotnet build WarTable.Api/WarTable.Api.csproj -c Release --nologo
