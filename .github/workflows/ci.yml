name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            WarTable.Client/package-lock.json

      - name: Install root tooling
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix WarTable.Client

      # The frontend build writes into WarTable.Api/wwwroot, which the backend
      # project embeds. It must run before the backend compiles.
      - name: Build frontend
        run: npm run build:frontend

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build backend
        run: dotnet build WarTable.slnx -c Release --nologo

      - name: Check backend formatting
        run: npm run format-check:backend

      - name: Validate frontend (format, lint, html)
        run: npm run validate

      - name: Test backend
        run: dotnet test WarTable.slnx -c Release --nologo --no-build

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: [a-z].+$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat(api): add context endpoint'."
            exit 1
          fi
          echo "PR title is valid: $PR_TITLE"
