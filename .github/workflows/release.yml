name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Generates release notes from Conventional Commits. Runs once and is shared
  # with both platform builds so the two release-asset uploads agree on the body.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff walks tags and history, so a shallow clone is not enough.
          fetch-depth: 0

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        continue-on-error: true

      # The action only exposes its result as an output; it has no `output`
      # input, so the file has to be written here.
      - name: Write release notes
        shell: bash
        env:
          NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          printf '%s\n' "$NOTES" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          if-no-files-found: warn

  publish:
    needs: changelog
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            ext: .exe
            archive: wartable-win-x64.zip
          - rid: linux-x64
            ext: ""
            archive: wartable-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            WarTable.Client/package-lock.json

      - run: npm ci
      - run: npm ci --prefix WarTable.Client

      - name: Build frontend
        run: npm run build:frontend

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      # Self-contained so the target machine needs no .NET install.
      # PublishSingleFile + the embedded wwwroot manifest produce one binary.
      - name: Publish
        run: |
          dotnet publish WarTable.Api/WarTable.Api.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=${{ steps.version.outputs.value }} \
            -o out/${{ matrix.rid }} \
            --nologo

      - name: Stage single binary
        shell: bash
        run: |
          mkdir -p staging
          binary="out/${{ matrix.rid }}/WarTable.Api${{ matrix.ext }}"
          test -f "$binary"
          cp "$binary" "staging/wartable${{ matrix.ext }}"

      - name: Package
        shell: bash
        run: |
          cd staging
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            zip -9 "../${{ matrix.archive }}" "wartable${{ matrix.ext }}"
          else
            tar -czf "../${{ matrix.archive }}" "wartable${{ matrix.ext }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # Creating the release from both matrix legs at once races (the second one
  # can hit a 422 while the first is still creating it), so it happens here
  # once, after both binaries exist.
  release:
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wartable-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
